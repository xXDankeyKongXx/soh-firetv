# Builds the Fire TV APK on every push to the firetv branch (or by hand from the Actions tab).
name: Fire TV APK

on:
  push:
    branches: [firetv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with libultraship, OTRExporter, ZAPDTR)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK 26, platform 31, CMake 3.31.5, Ninja
        run: |
          # GitHub's Ubuntu runners ship the Android SDK; just add what this project pins.
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.0.10792818" "platforms;android-31" "build-tools;34.0.0" | tail -3
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz -C "$HOME"
          CMAKE_DIR="$HOME/cmake-3.31.5-linux-x86_64"
          cp "$(which ninja)" "$CMAKE_DIR/bin/"
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$CMAKE_DIR" > Android/local.properties
          cat Android/local.properties

      - name: Signing key
        env:
          SOH_SIGNING: ${{ secrets.SOH_SIGNING }}
        run: |
          # Secret format: "<password>:<base64 PKCS12 keystore>". Without it the APK is debug-signed
          # and no release is published (it couldn't install over the signed version anyway).
          if [ -n "$SOH_SIGNING" ]; then
            # Tolerate copy/paste damage: spaces, tabs and line breaks anywhere in the value.
            CLEAN=$(printf '%s' "$SOH_SIGNING" | tr -d ' \t\r\n')
            PW="${CLEAN%%:*}"
            B64="${CLEAN#*:}"
            echo "::add-mask::$PW"
            echo "secret length ${#CLEAN}, key part ${#B64} chars (expected 5760)"
            if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/soh.p12" 2>/dev/null; then
              echo "::error::SOH_SIGNING doesn't contain a valid key (got ${#B64} of 5760 base64 characters). Re-paste the whole file contents."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/soh.p12" -storetype PKCS12 -storepass "$PW" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::error::SOH_SIGNING key or password is wrong. Re-paste the whole file contents."
              exit 1
            fi
            grep -i "SHA-256" "$RUNNER_TEMP/ks.txt" || true   # public certificate fingerprint, safe to log
            echo "SOH_KEYSTORE=$RUNNER_TEMP/soh.p12" >> "$GITHUB_ENV"
            echo "SOH_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::SOH_SIGNING secret not set: debug-signed build, no release"
          fi

      - name: Build release APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-firetv-apk
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to the apk-builds branch
        run: |
          mkdir publish && cp Android/app/build/outputs/apk/release/*.apk publish/
          cd publish
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk-builds
          git add -A
          git commit -qm "Fire TV APK from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk-builds

      - name: Publish GitHub release (used by the in-app updater)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls Android/app/build/outputs/apk/release/*.apk | head -1)
          CODE=$((100 + ${{ github.run_number }}))
          cp "$APK" ShipOfHarkinian-FireTV.apk
          NOTES=$(git log -1 --pretty=%B | head -c 3000)
          gh release create "vc-$CODE" ShipOfHarkinian-FireTV.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Fire TV build ${{ github.run_number }} (9.0.2-firetv.${{ github.run_number }})" \
            --notes "$NOTES"
