# Builds the Fire TV APK on every push to the firetv branch (or by hand from the Actions tab).
name: Fire TV APK

on:
  push:
    branches: [firetv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with libultraship, OTRExporter, ZAPDTR)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK 26, platform 31, CMake 3.31.5, Ninja
        run: |
          # GitHub's Ubuntu runners ship the Android SDK; just add what this project pins.
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.0.10792818" "platforms;android-31" "build-tools;34.0.0" | tail -3
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz -C "$HOME"
          CMAKE_DIR="$HOME/cmake-3.31.5-linux-x86_64"
          cp "$(which ninja)" "$CMAKE_DIR/bin/"
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$CMAKE_DIR" > Android/local.properties
          cat Android/local.properties

      - name: Build release APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-firetv-apk
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to the apk-builds branch
        run: |
          mkdir publish && cp Android/app/build/outputs/apk/release/*.apk publish/
          cd publish
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk-builds
          git add -A
          git commit -qm "Fire TV APK from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk-builds
