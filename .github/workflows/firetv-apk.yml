# Builds the Fire TV APK on every push to the firetv branch (or by hand from the Actions tab).
name: Fire TV APK

on:
  push:
    branches: [firetv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with libultraship, OTRExporter, ZAPDTR)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK 26, platform 31, CMake 3.31.5, Ninja
        run: |
          sdkmanager --install "ndk;26.0.10792818" "platforms;android-31" "build-tools;34.0.0" > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz -C "$HOME"
          CMAKE_DIR="$HOME/cmake-3.31.5-linux-x86_64"
          cp "$(which ninja)" "$CMAKE_DIR/bin/"
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$CMAKE_DIR" > Android/local.properties
          cat Android/local.properties

      - name: Build release APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-firetv-apk
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
